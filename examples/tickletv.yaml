# Tickle TV Scheduler config. Paths are relative to this file.

catalog: tickletv.sqlite

next:
  # Next's lineup.json. Channel playout folders and the xmltv folder are read from it.
  lineup: C:\ErsatzTV Next\config\lineup.json
  # Highest playout schema the running Next accepts: 0.0.5 for Next 0.2.0, 0.0.4 for legacy ErsatzTV's engine.
  schema_version: 0.0.5

channels:
  - number: "1"
    name: Tickle TV
    tvg_id: tickle.1
    horizon_hours: 24

    defaults:
      pad: 30            # 30, 60, 5, 10, or none: snap each show's end to this boundary
      max_breaks: 3
      min_act_seconds: 120
      pre_roll: false
      post_roll: true
      cold_open_break: true  # always break after a short first chapter (teaser), like real TV
      fallback_breaks: 0     # episodes with no chapter marks get no mid-show breaks...
      no_chapter_pad: 5      # ...and are padded at the end to the next 5 minutes

    ads:
      # Pool query. Terms join with AND; prefix a term with NOT to exclude.
      #   kind = commercial | tag:kids | show = TNG | year between 1988 and 1994 | era within 3 | duration <= 60s
      pool: kind = commercial AND era within 6
      cooldown_minutes: 90
      max_repeats_per_break: 1

    bumpers:
      pool: kind = bumper AND NOT tag:promo   # station IDs and break cards, not network promos
      before_break: true       # "we'll be right back", right before the ads
      after_break: true        # "now back to...", right after the ads
      # before_tag: break-out
      # after_tag: break-in
      min_ad_seconds: 15       # skip bumpers when a break is too short for them plus ads
      placement: show_edges    # one bumper before the show and one after it; every_break puts them around every break

    filler:
      pool: kind = filler      # covers whatever ads can't fill, looping; without it gaps are black

    gap:
      hold_grid: true          # start every slot on time; short leftover stretches become station breaks
      pool: kind = bumper AND tag:promo OR kind = commercial
      max_minutes: 12          # longer gaps air one more episode instead and drift

    # Daily grid. Each slot airs episodes of its show back to back until the next slot starts.
    schedule:
      - time: "06:00"
        show: The Simpsons
        order: shuffle          # every episode once before any repeats
      - time: "20:00"
        show: TNG
        order: chronological    # by original air date, wrapping at the end
        pad: 60
        max_breaks: 4
      - time: "23:00"
        show: The Simpsons
        order: shuffle
      # Several grids per channel: move the slots above under plans: and add a calendar.
      # plans:
      #   - name: Normal Day
      #     slots: [ ...the slots above... ]
      #   - name: Weekend
      #     slots:
      #       - { time: "09:00", show: Good Eats, order: shuffle }
      # calendar:
      #   - { plan: Weekend, days: [saturday, sunday] }
      #   - { plan: Christmas, holiday: christmas, days_before: 6 }   # the week leading up to Christmas Day
      #   - { plan: Summer, from: "07-01", to: "08-31" }              # every year
      # A slot in the Christmas plan that favours Christmas episodes:
      #   - { time: "20:00", show: The Simpsons, holiday: christmas, holiday_episodes: first }
      # A block: several shows share the slot and take turns, one episode each, in this order.
      # turns: random picks the next show at random instead (never the same show twice in a row).
      # - time: "01:00"
      #   shows: [Good Eats, How It's Made]
      #   turns: in_order
      #   order: shuffle
